<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>U-MA Hanon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: consola U-MA — placa de marca + transporte arriba, selector 1–60 en tres franjas, TECLADO CON MANOS como protagonista, ida/vuelta debajo, análisis abajo */
:root{
  --bg:#0a0a0c; --panel:#121216; --panel2:#18181e; --line:#26262e;
  --silver:#c8cbd2; --dim:#6b6e78; --faint:#3a3b44;
  --mag:#ff2d95; --cyan:#1fe0ff; --yel:#ffe01f;
  --hi:#ffffff; --stage:#0c0c10; --palm:200,203,210;
  --f-display:"Michroma","Eurostile","Arial Black",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
:root[data-uma="light"]{
  --bg:#e9ebef; --panel:#f6f7f9; --panel2:#e1e4e9; --line:#c6c9d0;
  --silver:#26282e; --dim:#686b75; --faint:#b3b6be;
  --mag:#e0127c; --cyan:#0094b8; --yel:#c99d00;
  --hi:#0b0b0e; --stage:#f3f4f7; --palm:60,63,72;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--silver);transition:background .2s}
body{font-family:var(--f-mono);font-size:13px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:4px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.plate{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 12px;border-radius:6px;
  background:linear-gradient(160deg,#eef0f3 0%,#b9bdc5 45%,#e3e5ea 60%,#9fa3ac 100%);
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 #7d818a,0 2px 10px #0008;color:#101014}
.plate b{font-family:var(--f-display);font-size:20px;letter-spacing:.04em;font-weight:400}
.plate .sq{display:flex;gap:3px}.plate .sq i{width:9px;height:9px;display:block}
.plate small{font-size:9px;letter-spacing:.1em;color:#3b3d44}
.ttl{display:flex;flex-direction:column;gap:2px}
.ttl h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.18em;color:var(--hi)}
.ttl span{font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.ctrls{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;align-items:center;gap:10px}
.bpm{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--hi);min-width:3ch;text-align:right;line-height:1}
.tempo{display:flex;flex-direction:column;gap:4px}
.tempo input{width:170px;accent-color:var(--cyan)}
.hanonrange{position:relative;height:12px;width:170px}
.hanonrange i{position:absolute;top:0;height:4px;background:var(--yel);border-radius:2px}
.hanonrange em{position:absolute;top:5px;font-style:normal;font-size:9px;color:var(--yel);transform:translateX(-50%)}
.step{width:26px;height:26px;font-size:15px;line-height:1}
.met{display:flex;gap:6px;align-items:center}
.met .led{width:12px;height:12px;border-radius:50%;background:var(--faint);transition:background .06s}
.met .led.on{background:var(--yel);box-shadow:0 0 10px var(--yel)}
.met .led.on.acc{background:var(--mag);box-shadow:0 0 10px var(--mag)}
.tog{padding:6px 10px;font-size:11px;letter-spacing:.1em}
.tog[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.themebtn{margin-left:auto;display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.themebtn svg{width:16px;height:16px}
.midi{display:flex;align-items:center;gap:8px}
.midi .dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.midi.ok .dot{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.midi.bad .dot{background:var(--mag)}
.midi .st{font-size:10px;color:var(--dim);max-width:150px;line-height:1.3}

/* selector */
.sel{display:grid;gap:6px}
.band{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center}
.band .tag{display:flex;flex-direction:column;gap:1px;border-left:3px solid var(--c);padding-left:8px}
.band .tag b{font-family:var(--f-display);font-weight:400;font-size:14px;color:var(--c)}
.band .tag span{font-size:9px;color:var(--dim);letter-spacing:.1em}
.tiles{display:flex;flex-wrap:wrap;gap:4px}
.tile{width:34px;height:30px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--faint);border-color:#1e1e25;background:#0f0f13;position:relative}
.tile.ok{color:var(--silver);border-color:var(--line);background:var(--panel2)}
.tile.ok::after{content:"";position:absolute;left:4px;right:4px;bottom:3px;height:2px;background:var(--c);opacity:.8}
.tile.cur{background:var(--c);color:#000;border-color:var(--c)}
.tile.cur::after{display:none}

/* main */
.exhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px}
.exnum{background:none;border:0;padding:0;text-align:left;cursor:pointer;position:relative}
.exnum::after{content:"";display:inline-block;margin-left:8px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--dim);vertical-align:middle;transition:transform .15s}
.exnum[aria-expanded="true"]::after{transform:rotate(180deg)}
.picker{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.pgrid{display:grid;grid-template-columns:repeat(30,1fr);gap:3px}
.pgrid .tile{width:auto;height:26px;font-size:10px;padding:0}
@media (max-width:600px){.pgrid{grid-template-columns:repeat(12,1fr)}.pgrid .tile{height:26px}}
.exnum{font-family:var(--f-display);font-size:54px;line-height:.9;color:var(--hi)}
.exnum small{font-size:14px;color:var(--mag);letter-spacing:.2em;display:block;margin-bottom:6px}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.legend span{display:flex;align-items:center;gap:5px;font-size:11px}
.legend i{width:16px;height:16px;border-radius:3px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:600;color:#000}
.transport{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tbtn{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.tbtn svg{width:14px;height:14px;fill:currentColor}
.tbtn.play{border-color:var(--cyan);color:var(--cyan)}
.modes{display:flex;gap:4px;flex-wrap:wrap}
.tbtn .ar{font-family:var(--f-mono);font-size:13px;line-height:1;font-weight:600}
#play-down{border-color:var(--mag);color:var(--mag)}#play-down.active{background:var(--mag);color:#000}
#play-twice{border-color:var(--yel);color:var(--yel)}#play-twice.active{background:var(--yel);color:#000}
#loopBtn[aria-pressed="true"]{background:var(--yel);color:#000;border-color:var(--yel)}
.tbtn.play.active{background:var(--cyan);color:#000}
.tbtn.rec{border-color:var(--mag);color:var(--mag)}
.tbtn.rec.active{background:var(--mag);color:#000}
.tbtn[aria-pressed="true"]{border-color:var(--yel);color:var(--yel)}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .15s}
.card.live{border-color:var(--c)}
.card h2{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:400;font-size:15px;letter-spacing:.2em;color:var(--c)}
.card h2 .arr{font-size:22px;line-height:1}
.card h2 .rng{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--dim);letter-spacing:.1em}
.staffbox{overflow-x:auto}
.staffbox svg{display:block;width:100%;height:auto;min-width:300px}
.row2{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:stretch}
.roll{width:100%;height:132px;display:block;background:#0c0c10;border-radius:4px}
.hands svg{display:block;height:132px;width:auto}

.hero{background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hero .hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hz{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--dim);letter-spacing:.08em}
.hz i{width:12px;height:8px;border-radius:2px;display:block;opacity:.8}
.hz i.solid{background:var(--silver)}.hz i.hollow{border:1.5px solid var(--silver);background:rgba(200,203,210,.25)}
.zoom{margin-left:auto;display:flex;gap:4px;align-items:center}
.zoom .tog{padding:5px 9px;min-width:30px}
#roll{cursor:grab;touch-action:pan-y;border-radius:6px}
#roll.drag{cursor:grabbing}
#mini{cursor:pointer;touch-action:none;border-radius:4px}
.row2 .staffbox{min-width:0}
.grp{font-family:var(--f-display);font-size:18px;letter-spacing:.08em}
.hz i.ghost{border:1.5px dashed var(--silver);background:none}
.order{display:flex;flex-direction:column;gap:6px;align-items:center;overflow-x:auto}
.orow{display:flex;gap:5px;align-items:center}
.orow .lbl{width:24px}
.orow i{font-style:normal;width:40px;height:40px;border-radius:6px;border:1.5px solid var(--fc);color:var(--fc);display:grid;place-items:center;font-size:17px;font-weight:600;position:relative;transition:transform .05s}
.orow i small{position:absolute;top:2px;left:4px;font-size:8px;color:var(--dim);font-weight:400}
.orow i.on{background:var(--fc);color:#000;transform:scale(1.12)}
.orow i.on small{color:#000}
.orow i.dbl{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-size:13px}
.orow i.dbl b{color:var(--fc2);font-weight:600}.orow i.dbl.on b{color:#000}
.order.dense .orow i{width:30px;height:34px;font-size:15px}
@media (max-width:600px){.order.dense .orow{gap:2px}.order.dense .orow i{width:19px;height:28px;font-size:12px;border-radius:4px}.order.dense .orow i small{display:none}.order.dense .orow .lbl{width:14px}}
@media (max-width:460px){.orow i{width:34px;height:34px;font-size:15px}.orow{gap:3px}}
.pair.small .card{padding:8px 12px;gap:4px}
.pair.small .card h2{font-size:12px}
.pair.small .staffbox svg{max-height:150px;width:auto;max-width:100%;margin:0 auto}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel .hd .lbl{color:var(--silver)}
.panel .hd .note{font-size:10px;color:var(--dim)}
canvas.full{width:100%;display:block}
.fingers{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.fingers .h{display:flex;gap:6px;align-items:flex-end}
.fingers .h b{font-family:var(--f-display);font-weight:400;font-size:11px;color:var(--dim);margin:0 4px 6px}
.fg{width:30px;border-radius:15px 15px 6px 6px;border:1px solid var(--faint);display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-size:12px;font-weight:600;color:var(--dim);transition:all .05s}
.fg.on{color:#000;border-color:transparent}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--panel2);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:26px;font-weight:600;color:var(--hi);font-variant-numeric:tabular-nums;line-height:1}
.kpi b small{font-size:12px;color:var(--dim);font-weight:400}
.kpi .bar{height:4px;background:var(--faint);border-radius:2px;overflow:hidden}
.kpi .bar i{display:block;height:100%}
.agrid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.chip{font-size:10px;letter-spacing:.14em;padding:3px 7px;border-radius:3px;border:1px solid var(--yel);color:var(--yel)}
.chip.real{border-color:var(--cyan);color:var(--cyan)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--mag);color:#fff;padding:8px 14px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1}

@media (max-width:820px){
  .pair,.agrid{grid-template-columns:1fr}
  .ctrls{margin-left:0}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .transport{margin-left:0}
}
@media (max-width:460px){
  .row2{grid-template-columns:1fr}
  .band{grid-template-columns:1fr}
  .tempo input,.hanonrange{width:130px}
  .exnum{font-size:42px}
  .zoom{margin-left:0}
  .tiles{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
  .tile{width:auto;height:28px;font-size:11px;padding:0}
  .band{gap:4px}
}
body:not(.midi-on) .midi-only{display:none!important}
.exsub{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;color:var(--silver);align-self:center}
.variants{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.vchip{flex:0 0 auto;padding:6px 10px;font-size:11px;font-family:var(--f-mono);white-space:nowrap;color:var(--silver)}
.vchip.on{background:var(--cyan);border-color:var(--cyan);color:#000}
.dirtabs{display:none}
.dirtabs button{flex:1;padding:6px;font-size:11px;letter-spacing:.14em;font-family:var(--f-display);color:var(--dim);background:var(--panel)}
.dirtabs button[data-d="up"].on{color:#000;background:var(--cyan);border-color:var(--cyan)}
.dirtabs button[data-d="down"].on{color:#000;background:var(--mag);border-color:var(--mag)}
@media (max-width:600px){
  body{padding-block:8px 28px}
  .wrap{gap:8px}
  header{gap:10px;flex-wrap:nowrap}
  .plate{padding:5px 9px;gap:6px}.plate b{font-size:14px}.plate small{display:none}.plate .sq i{width:7px;height:7px}
  .ttl h1{font-size:16px}.ttl span{display:none}
  .ctrls{flex-wrap:nowrap;gap:6px;width:100%}
  .box{padding:5px 7px;gap:6px}
  .ctrls .box:first-child{flex:1;min-width:0}
  .tempo{flex:1;min-width:0}
  .tempo input{width:100%}
  .hanonrange{display:none}
  .bpm{font-size:22px}
  .step{width:24px;height:24px}
  .midi .st{display:none}
  .tog{padding:5px 7px;font-size:10px}
  .met .led{width:9px;height:9px}
  .met .lbl{display:none}
  .exhead{gap:6px 10px;align-items:center}
  .exnum{font-size:34px}.exnum small{font-size:10px;margin-bottom:3px}
  .legend{gap:4px}.legend i{width:14px;height:14px;font-size:9px}
  .transport{gap:5px;margin-left:auto}
  .tbtn{padding:7px 9px;font-size:10px;gap:5px}
  #stopBtn .t,#loopBtn .t,#recBtn .t,#play-up .t,#play-down .t,#play-twice .t{display:none}
  .transport{gap:4px}.modes{flex-wrap:nowrap;gap:4px}
  #play-demo{padding:7px 8px}
  .transport .tbtn{padding:7px 8px}
  .dirtabs{display:flex;gap:6px;margin-bottom:-2px}
  .pair.small .card h2{display:none!important}
  #pair[data-show="up"] #cardDown,#pair[data-show="down"] #cardUp{display:none}
  .pair{gap:6px}
  .pair.small .card{padding:6px 8px;gap:0}
  .pair.small .card h2{font-size:10px;gap:6px}.pair.small .card h2 .arr{font-size:15px}
  .pair.small .staffbox svg{max-height:none;width:100%;min-width:0}
  .hero{padding:8px;gap:6px}
  .hero .hd{gap:8px}
  .grp{font-size:15px}
  .hz{font-size:9px}
  .orow i{width:30px;height:30px;font-size:14px}.orow{gap:3px}.orow .lbl{width:18px;font-size:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="plate" aria-label="U-MA">
      <b>U-MA</b>
      <span class="sq"><i style="background:var(--mag)"></i><i style="background:var(--cyan)"></i><i style="background:var(--yel)"></i></span>
      <small>サウンド</small>
    </div>
    <div class="ttl"><h1>HANON</h1><span>El pianista virtuoso · 60</span></div>
    <button class="themebtn" id="themeBtn" aria-label="Cambiar a modo claro"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2a8 8 0 010 16z" fill="currentColor"/></svg><span id="themeLbl">claro</span></button>
  </header>
  <section class="ctrlrow">
    <div class="ctrls" style="margin-left:0">
      <div class="box">
        <button class="step" id="bpmDown" aria-label="Bajar tempo">−</button>
        <div class="tempo">
          <div style="display:flex;align-items:baseline;gap:6px"><span class="bpm" id="bpmVal">60</span><span class="lbl">♩ =</span></div>
          <input type="range" id="bpm" min="40" max="160" value="60" aria-label="Tempo">
          <div class="hanonrange" aria-hidden="true"><i id="hr"></i><em id="hr1">60</em><em id="hr2">108</em></div>
        </div>
        <button class="step" id="bpmUp" aria-label="Subir tempo">+</button>
      </div>
      <div class="box met">
        <button class="tog" id="metBtn" aria-pressed="true">MET</button>
        <span class="led acc" id="led0"></span><span class="led" id="led1"></span>
        <span class="lbl" id="metTs" style="margin-left:2px">2/4</span>
      </div>
      <div class="box midi" id="midiBox">
        <button class="tog" id="midiBtn">MIDI</button>
        <span class="dot"></span><span class="st" id="midiSt">sin conectar</span>
      </div>
    </div>
  </section>
  <section class="picker" id="picker" hidden aria-label="Todas las lecciones"><div class="pgrid" id="pgrid"></div></section>
  <section class="exhead">
    <button class="exnum" id="exNum" aria-expanded="false" aria-controls="picker"><small>PARTE I</small>01</button>
    <div class="exsub" id="exSub"></div>
    <div class="legend" id="legend"></div>
    <div class="transport">
      <div class="modes" role="group" aria-label="Qué suena">
        <button class="tbtn play mode" id="play-demo" data-m="demo"><svg viewBox="0 0 10 10"><path d="M1 0l9 5-9 5z"/></svg><span class="t">2 pasadas</span></button>
        <button class="tbtn play mode" id="play-up" data-m="up"><b class="ar">↑</b><span class="t">subida</span></button>
        <button class="tbtn play mode" id="play-down" data-m="down"><b class="ar">↓</b><span class="t">bajada</span></button>
        <button class="tbtn play mode" id="play-twice" data-m="twice"><b class="ar">↑↓×2</b><span class="t">2 vueltas</span></button>
      </div>
      <button class="tbtn" id="stopBtn"><svg viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8"/></svg><span class="t">stop</span></button>
      <button class="tbtn" id="loopBtn" aria-pressed="false"><svg viewBox="0 0 10 10"><path d="M2 3h5V1l3 3-3 3V5H3v2H1V4a1 1 0 011-1zM8 7v2H1v-2z" opacity=".9"/></svg><span class="t">loop</span></button>
      <button class="tbtn rec midi-only" id="recBtn"><svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.5"/></svg><span class="t">rec</span></button>
    </div>
  </section>
  <div class="variants" id="variants" hidden></div>
  <div class="dirtabs" id="dirtabs"><button data-d="up" class="on">↑ IDA</button><button data-d="down">↓ VUELTA</button></div>

// Nota escrita: dia = índice diatónico absoluto (Do4 = 28), acc = alteración en semitonos.
const SC=[0,2,4,5,7,9,11];
const mod=(a,b)=>((a%b)+b)%b;

const dg=d=>N(21+d);                         // grado de Do mayor, 0 = Do3
const fromMidi=(m,flat)=>{const pc=mod(m,12),o=Math.floor(m/12)-1;
  const L=flat?[0,1,1,2,2,3,4,4,5,5,6,6]:[0,0,1,1,2,3,3,4,4,5,5,6];const dia=7*o+L[pc];return N(dia,m-N(dia).midi);};
const R=s=>s.replace(/\s/g,'').split('').map(Number);
const M=(bar,beat,ts)=>({bar,beat,ts});
const M24=M(8,4,'2/4'),M44=M(16,4,'4/4'),M34=M(12,4,'3/4');

// Empaqueta una lista de notas en compases (grupos) y tramos (secciones por dirección).
function pack(notes,barLen,fin){
  const out=[];let sec=-1;const bars=[];
  const BI=notes.map((n,k)=>n.bar!=null?n.bar:Math.floor(k/barLen)),II=[];{const c={};BI.forEach((b,k)=>{II[k]=c[b]=(c[b]==null?0:c[b]+1);});}
  notes.forEach((n,k)=>{const b=BI[k];if(!bars[b])bars[b]={dir:n.dir,label:n.label};});
  const secOf=[];bars.forEach((b,i)=>{const p=bars[i-1];if(!p||b.dir!==p.dir||b.label!==p.label)sec++;secOf[i]=sec;});
  const cnt={};secOf.forEach(s=>cnt[s]=(cnt[s]||0)+1);const first={};secOf.forEach((s,i)=>{if(first[s]==null)first[s]=i;});
  notes.forEach((n,k)=>{const b=BI[k];out.push(Object.assign({},n,{sec:secOf[b],g:b-first[secOf[b]],n:cnt[secOf[b]],i:II[k],gk:'b'+b,dir:bars[b].dir,label:bars[b].label}));});
  if(fin)out.push(Object.assign({dur:8},fin,{fin:true,gk:'fin',sec:sec,g:0,n:1,i:Math.max(...II)+1,dir:'down'}));
  return out;
}
// Ejercicio de secuencia (Parte I y II): células en grados de Do que se desplazan un grado por compás.
function seqEx(secs,foco,meter,final={r:0,l:-7,fr:1,fl:5}){
  return {foco,meter,build(){
    const notes=[];secs.forEach(s=>{for(let g=0;g<s.reps;g++)s.r.forEach((d,i)=>{const sh=g*s.step;
      notes.push({r:dg(d+sh),l:dg((s.l?s.l[i]:d-7)+sh),fr:s.fr[i],fl:s.fl[i],dir:s.dir,label:s.label});});});
    return pack(notes,secs[0].r.length,{r:dg(final.r),l:dg(final.l),fr:final.fr,fl:final.fl});}};
}
// Atajo para Parte I/II: ida (sube nUp) y vuelta (baja nDown) en movimiento paralelo a la octava.
function H(up,urh,ulh,dn,drh,dlh,nUp=14,nDown=14,foco=[],meter=M24){
  return seqEx([{r:up,fr:R(urh),fl:R(ulh),reps:nUp,step:1,dir:'up'},{r:dn,fr:R(drh),fl:R(dlh),reps:nDown,step:-1,dir:'down'}],foco,meter);
}
// Expande duraciones a pasos de semicorchea (null = silencio/continuación).
function expand(steps){const F=[];steps.forEach(s=>{s.rh=s.r.midi;s.lh=s.l.midi;s.rh2=s.r2?s.r2.midi:null;s.lh2=s.l2?s.l2.midi:null;s.dur=s.dur||1;F.push(s);for(let k=1;k<s.dur;k++)F.push(null);});
  for(let k=0;k<7;k++)F.push(null);F.forEach((e,ix)=>{if(e)e.full=ix;});return F;}

function tonic(letter,acc){const L=LET.indexOf(letter),pc=mod(SC[L]+acc,12),midi=42+mod(pc-6,12);
  const o=Math.round((midi-acc-SC[L])/12)-1;return {L,acc,midi,dia:7*o+L};}
const STEPS={maj:[0,2,4,5,7,9,11],harm:[0,2,3,5,7,8,11],melUp:[0,2,3,5,7,9,11],nat:[0,2,3,5,7,8,10]};
function degNote(t,k,steps){const dia=t.dia+k,midi=t.midi+12*Math.floor(k/7)+steps[mod(k,7)];return N(dia,midi-N(dia).midi);}
// digitación de escalas (ciclo desde la tónica, grados 1..7); MI: la tónica abajo de todo usa 5.

const keyId=(k)=>{const acc=k[2]===-1?'b':k[2]===1?'#':'';return k[1]==='m'?(k[0].toLowerCase()+acc):(k[0]+acc);};
function scaleEx(){
  const variants=[];
  KEYS.forEach(k=>{const forms=k[1]==='m'?[['harm','armónica'],['mel','melódica']]:[['maj','']];
    forms.forEach(([form,fl])=>variants.push({label:k[3]+(fl?' '+(form==='harm'?'¹':'²'):''),title:k[3]+(fl?' · '+fl:' mayor'),k,form}));});
  return {foco:[1,2,3,4,5],meter:M24,variants,build(v){
    const {k,form}=v,t=tonic(k[0],k[2]),id=keyId(k),[rf,lf]=SF[id].map(R);const notes=[];
    const idx=[];for(let i=0;i<=27;i++)idx.push([i,'up']);for(let i=28;i>=1;i--)idx.push([i,'down']);
    idx.forEach(([i,dir],n)=>{const st=form==='maj'?STEPS.maj:form==='harm'?STEPS.harm:(dir==='up'?STEPS.melUp:STEPS.nat);
      const r=degNote(t,i,st),l=N(r.dia-7,r.acc);let fr=rf[mod(i,7)],fl=lf[mod(i,7)];
      if(i===28&&fr===1)fr=5; if(i===0&&fl===1)fl=5;
      notes.push({r,l,fr,fl,dir});});
    const r0=degNote(t,0,STEPS.maj);let fl0=lf[0]===1?5:lf[0];
    return pack(notes,8,{r:r0,l:N(r0.dia-7,r0.acc),fr:rf[0],fl:fl0});}};
}
/* ---------- arpegios (41) ---------- */
const AF={C:['1231','5421'],a:['1231','5421'],F:['1231','5421'],d:['1231','5421'],Bb:['2124','3213'],g:['1231','5421'],

function arpEx(){
  const variants=KEYS.map(k=>({label:k[3],title:k[3]+(k[1]==='m'?'':' mayor'),k}));
  return {foco:[1,2,3,4,5],meter:M34,variants,build(v){
    const k=v.k,t=tonic(k[0],k[2]),id=keyId(k),[rf,lf]=AF[id].map(R),semi=k[1]==='m'?[0,3,7]:[0,4,7];
    const tone=j=>{const o=Math.floor(j/3),q=j%3,dia=t.dia+7*o+[0,2,4][q],midi=t.midi+12*o+semi[q];return N(dia,midi-N(dia).midi);};
    const fR=j=>j===0?rf[0]:[rf[3],rf[1],rf[2]][j%3], fL=j=>j===0?lf[0]:[lf[3],lf[1],lf[2]][j%3];
    const notes=[];for(let j=0;j<12;j++)notes.push({j,dir:'up'});for(let j=12;j>=1;j--)notes.push({j,dir:'down'});
    const N2=notes.map(({j,dir})=>{const r=tone(j);let fr=fR(j);if(j===12&&fr===1)fr=5;return {r,l:N(r.dia-7,r.acc),fr,fl:fL(j),dir};});
    const r0=tone(0);return pack(N2,12,{r:r0,l:N(r0.dia-7,r0.acc),fr:rf[0],fl:lf[0],dur:8});}};
}
/* ---------- cromáticas (40) ---------- */
function chromF(m,h){const pc=mod(m,12),bl=[1,3,6,8,10].includes(pc);if(bl)return 3;if(h==='r')return (pc===0||pc===5)?2:1;return (pc===4||pc===11)?2:1;}
function chromEx(){
  const variants=[{label:'8ª',title:'a la octava',l:36,r:48},{label:'3ª m',title:'a la tercera menor',l:48,r:51},{label:'3ª M',title:'a la tercera mayor',l:48,r:52},
    {label:'6ª M',title:'a la sexta mayor',l:39,r:48},{label:'6ª m',title:'a la sexta menor',l:40,r:48},
    {label:'↔ 8ª',title:'contraria, desde la octava',l:36,r:84,c:1},{label:'↔ 3ª m',title:'contraria, desde la tercera menor',l:36,r:87,c:1},{label:'↔ 3ª M',title:'contraria, desde la tercera mayor',l:36,r:88,c:1}];
  return {foco:[1,2,3],meter:M34,variants,build(v){
    const ns=[];
    if(!v.c){for(let i=0;i<48;i++)ns.push([v.r+i,v.l+i,'up']);for(let i=48;i>=1;i--)ns.push([v.r+i,v.l+i,'down']);}
    else{for(let i=0;i<24;i++)ns.push([v.r-i,v.l+i,'down']);for(let i=24;i>=1;i--)ns.push([v.r-i,v.l+i,'up']);}
    const top=Math.max(...ns.map(n=>n[0])),bot=Math.min(...ns.map(n=>n[1]));
    const notes=ns.map(([rm,lm,dir],k)=>{const rUp=v.c?dir==='up':dir==='up',lUp=v.c?dir==='down':dir==='up';
      let fr=chromF(rm,'r'),fl=chromF(lm,'l');if(k===0&&fr!==3)fr=1;if(rm===top)fr=5;else if(rm===top-1&&fr!==3)fr=4;if(lm===bot)fl=4;
      return {r:fromMidi(rm,!rUp),l:fromMidi(lm,!lUp),fr,fl,dir};});
    let fr=chromF(v.r,'r');if(v.r===top)fr=5;
    return pack(notes,12,{r:fromMidi(v.r),l:fromMidi(v.l),fr,fl:4});}};
}
/* ---------- séptimas en arpegio (42 disminuida, 43 dominante) ---------- */
function sevEx(kind){
  const roots=kind==='dim'?[['C',[0,2,3,5]],['D',[0,2,4,5]],['E',[0,2,4,5]],['F',[0,2,3,5]],['G',[0,2,3,5]],['A',[0,2,4,5]],['B',[0,2,4,6]]]
                          :['C','D','E','F','G','A','B'].map(c=>[c,[0,2,4,6]]);
  const semis=kind==='dim'?[0,3,6,9]:[0,4,7,10];
  const NM={C:'Do',D:'Re',E:'Mi',F:'Fa',G:'Sol',A:'La',B:'Si'};
  return {foco:[1,2,3,4,5],meter:M24,build(){
    const notes=[];
    roots.forEach(([c,lets])=>{const L=LET.indexOf(c),rm=48+SC[L],rd=21+L,lab=NM[c]+(kind==='dim'?'°7':'7');
      const tn=j=>{const o=Math.floor(j/4),q=mod(j,4),dia=rd+7*o+lets[q],midi=rm+12*o+semis[q];return N(dia,midi-N(dia).midi);};
      const rfU=j=>[1,2,3,4][mod(j,4)], rfD=j=>[4,1,2,3][mod(j,4)], lfU=j=>[1,4,3,2][mod(j,4)], lfD=j=>[1,4,3,2][mod(j,4)];
      const add=(j,dir,fr,fl)=>{const r=tn(j);notes.push({r,l:N(r.dia-7,r.acc),fr,fl,dir,label:lab});};
      for(let rep=0;rep<4;rep++)[0,1,2,3,4,3,2,1].forEach((j,i)=>add(j,i<4?'up':'down',[1,2,3,4,5,4,3,2][i],[5,4,3,2,1,2,3,4][i]));
      for(let j=0;j<8;j++)add(j,'up',rfU(j),j===0?5:lfU(j));
      [8,9,10,11,12,11,10,9].forEach((j,i)=>add(j,i<4?'up':'down',j===12?5:rfU(j),lfU(j)));
      for(let j=8;j>=1;j--)add(j,'down',rfD(j),lfD(j));
    });
    const r0=N(21,0);return pack(notes,8,{r:r0,l:N(14,0),fr:1,fl:5});}};
}

  ['l','r'].forEach(h=>{const nx=P[h].hi+1;if(nx<S.length&&!S[nx].fin){const Q=posAt(nx,h);drawHand(Q.m,h,true);
    if(h==='r'){const a=Object.values(P.r.m),b=Object.values(Q.m),d=(Math.min(...b)+Math.max(...b))-(Math.min(...a)+Math.max(...a));
      if(d){const xs=a.map(xOf),xa=d>0?Math.max(...xs)+fw:Math.min(...xs)-fw;g.fillStyle=step.dir==='up'?C.cyan:C.mag;g.font=`600 ${narrow?16:22}px IBM Plex Mono`;g.textAlign='center';g.fillText(d>0?'→':'←',xa+(d>0?10:-10),palmY+palmH*.72);g.textAlign='left';}}}});
  drawHand(P.l.m,'l',false);drawHand(P.r.m,'r',false);
}
/* orden del grupo: 8 casillas por mano */
function drawOrder(){
  const step=curStep||FULL[0],grp=grpOf(step),col=step.dir==='up'?'var(--cyan)':'var(--mag)';
  const tag=document.getElementById('grpTag');tag.style.color=col;
  tag.textContent=step.fin?'fin':`${step.dir==='up'?'↑':'↓'} ${step.label?step.label+' · ':''}${step.g+1}/${step.n}`;
  const row=(h,lab)=>`<span class="lbl">${lab}</span>`+grp.map((e,i)=>{const f=h==='r'?e.fr:e.fl,f2=h==='r'?e.fr2:e.fl2,on=curStep&&curStep.full===e.full;
    return `<i class="${on?'on':''}${f2?' dbl':''}" style="--fc:${FC[f]};--fc2:${FC[f2]||FC[f]}"><small>${i+1}</small>${f2?`<b>${f2}</b>`:''}${f}</i>`}).join('');
  const o=document.getElementById('order');o.classList.toggle('dense',grp.length>8);
  o.innerHTML=`<div class="orow">${row('r','MD')}</div><div class="orow">${row('l','MI')}</div>`;
}

/* ---------- render ---------- */
let showDir='up';
function setDir(d){showDir=d;document.getElementById('pair').dataset.show=d;document.querySelectorAll('#dirtabs button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));}
document.querySelectorAll('#dirtabs button').forEach(b=>b.onclick=()=>setDir(b.dataset.d));
let mode='demo';
function renderAll(){
  const p=partOf(cur);
  document.getElementById('exNum').innerHTML=`<small style="color:${p.c}">PARTE ${p.n}</small>${String(cur).padStart(2,'0')}`;
  const up=cellNotes('up'),dn=cellNotes('down');
  document.getElementById('staffUp').innerHTML=staffSVG(up,'u');
  document.getElementById('staffDown').innerHTML=staffSVG(dn,'d');
  document.getElementById('rngUp').textContent=`×${up[0].n}`;
  document.getElementById('rngDown').textContent=`×${dn[0].n}`;
  upGk=up[0].gk;dnGk=dn[0].gk;
  const v=ex.variants?ex.variants[vIdx]:null;
  document.getElementById('exSub').textContent=v?v.title:'';
  document.getElementById('metTs').textContent=ex.meter.ts;
  drawVariants();
  kbStart=null;drawFoco();drawDynamic();drawAnalysis();
}
let lastHi={u:null,d:null},upGk=null,dnGk=null;
function hiStaff(col,i){const ids=k=>['r','l','rb','lb'].map(h=>document.getElementById(col+h[0]+k+(h[1]||''))).filter(Boolean);
  const paint=(e,c)=>e.getAttribute('fill')!=='none'?e.setAttribute('fill',c):e.setAttribute('stroke',c);
  const prev=lastHi[col];if(prev!=null)ids(prev).forEach(e=>paint(e,C.silver));
  lastHi[col]=i;if(i!=null)ids(i).forEach(e=>paint(e,col==='u'?C.cyan:C.mag));}
function drawDynamic(){
  const ui=curStep&&curStep.gk===upGk?curStep.i:null;
  const di=curStep&&(curStep.gk===dnGk||curStep.fin)?curStep.i:null;
  hiStaff('u',ui);hiStaff('d',di);
  document.getElementById('cardUp').classList.toggle('live',ui!=null);
  document.getElementById('cardDown').classList.toggle('live',di!=null);
  drawKB();drawOrder();
  if(curStep&&curStep.dir!==showDir)setDir(curStep.dir);
}

/* ---------- audio ---------- */
let ctx=null,master;
function ensureCtx(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.9;const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);}if(ctx.state==='suspended')ctx.resume();}
function tone(m,t,vel=.8,dur=.35){
  const f=440*2**((m-69)/12),o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain(),lp=ctx.createBiquadFilter();
  o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2.001;g2.gain.value=.25;
  lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(16000,f*10),t);lp.frequency.exponentialRampToValueAtTime(f*2.2,t+dur+.4);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16*vel,t+.004);g.gain.exponentialRampToValueAtTime(.05*vel,t+.12);g.gain.exponentialRampToValueAtTime(.0005,t+dur+.6);
  o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(master);o.start(t);o2.start(t);o.stop(t+dur+.7);o2.stop(t+dur+.7);
}
function click(t,acc){const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=acc?1760:1180;
  g.gain.setValueAtTime(acc?.22:.13,t);g.gain.exponentialRampToValueAtTime(.0005,t+.05);o.connect(g);g.connect(master);o.start(t);o.stop(t+.06);}

/* ---------- transporte ---------- */
// qué suena: 2 pasadas (demo), solo subida, solo bajada o 2 vueltas completas
function buildSeq(m){
  if(m==='demo')return buildDemo(FULL);
  const fi=FULL.findIndex(e=>e&&e.fin),body=FULL.slice(0,fi),tail=FULL.slice(fi);
  if(m==='twice')return body.concat(body,tail);
  // cada paso nulo pertenece a la última nota anterior
  let own=null;const keep=FULL.map(e=>{if(e)own=e;return own&&!own.fin&&own.dir===m;});
  const out=FULL.filter((e,i)=>keep[i]);
  if(m==='down'&&!out.length)return FULL.slice();
  return m==='down'?out.concat(tail):out;
}
let playing=false,seq=[],si=0,nextT=0,timer=null,visQ=[],rec=false,expected=[],played=[],endT=0,raf=null;
function start(m,isRec=false){
  stop();ensureCtx();mode=m;rec=isRec;seq=buildSeq(m);
  si=(metOn||isRec)?-ex.meter.bar:0;nextT=ctx.currentTime+.12;playing=true;expected=[];played=[];endT=0;
  timer=setInterval(sched,25);sched();raf=requestAnimationFrame(tick);
  const mb=document.getElementById('play-'+m);if(mb)mb.classList.add('active');
  if(isRec)document.getElementById('recBtn').classList.add('active');
}
function sched(){
  const sp=60/bpm/4;
  while(playing&&!endT&&nextT<ctx.currentTime+.15){
    const t=nextT;
    const B=ex.meter;if((metOn||rec)&&mod(si,B.beat)===0&&(si<0||si<seq.length)){const acc=mod(si,B.bar)===0;click(t,acc);visQ.push({t,beat:acc?0:1});}
    if(si>=0){const e=seq[si];
      if(e){const dur=e.fin?sp*7:sp*(e.dur>1?e.dur-.2:.9);
        if(!rec){tone(e.rh,t,.85,dur);tone(e.lh,t,.75,dur);if(e.rh2!=null)tone(e.rh2,t,.7,dur);if(e.lh2!=null)tone(e.lh2,t,.6,dur);}
        visQ.push({t,step:e});
        if(rec){const pt=performance.now()+(t-ctx.currentTime)*1000;expected.push({midi:e.rh,t:pt,f:e.fr,h:'r',ix:expected.length,full:e.full});expected.push({midi:e.lh,t:pt,f:e.fl,h:'l',ix:expected.length,full:e.full});if(e.rh2!=null)expected.push({midi:e.rh2,t:pt,f:e.fr2,h:'r',ix:expected.length,full:e.full});if(e.lh2!=null)expected.push({midi:e.lh2,t:pt,f:e.fl2,h:'l',ix:expected.length,full:e.full});}
      }}
    nextT+=sp;si++;
    if(si>=seq.length){if(loop&&!rec){si=0;}else{endT=nextT;}}
  }
}
function tick(){
  if(!ctx)return;const now=ctx.currentTime;let dirty=false;
  while(visQ.length&&visQ[0].t<=now){const v=visQ.shift();
    if(v.step){curStep=v.step;dirty=true;}
    if(v.beat!=null){const L=document.getElementById('led'+v.beat);L.classList.add('on');setTimeout(()=>L.classList.remove('on'),90);}}
  if(dirty)drawDynamic();
  if(endT&&now>endT+.05){const wasRec=rec;stop();if(wasRec)finishRec();return;}
  if(playing)raf=requestAnimationFrame(tick);
}
function stop(){
  playing=false;clearInterval(timer);cancelAnimationFrame(raf);visQ=[];curStep=null;
  document.querySelectorAll('.mode,#recBtn').forEach(b=>b.classList.remove('active'));
  if(rec&&!endT){rec=false;}
  drawDynamic();
}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{if(playing&&mode===b.dataset.m){rec=false;stop();}else start(b.dataset.m);});
document.getElementById('themeBtn').onclick=()=>setTheme(document.documentElement.dataset.uma==='light'?'dark':'light');
document.getElementById('stopBtn').onclick=()=>{rec=false;stop()};
document.getElementById('loopBtn').onclick=e=>{loop=!loop;e.currentTarget.setAttribute('aria-pressed',loop)};
document.getElementById('metBtn').onclick=e=>{metOn=!metOn;e.currentTarget.setAttribute('aria-pressed',metOn)};
document.getElementById('recBtn').onclick=()=>{
  if(!midiReady){toast('REC necesita un teclado MIDI conectado');initMIDI();return;}
  start(mode,true);
};

/* tempo */
const bpmIn=document.getElementById('bpm');
function setBpm(v){bpm=Math.max(40,Math.min(160,v));bpmIn.value=bpm;document.getElementById('bpmVal').textContent=bpm;}
bpmIn.oninput=e=>setBpm(+e.target.value);
document.getElementById('bpmDown').onclick=()=>setBpm(bpm-4);
document.getElementById('bpmUp').onclick=()=>setBpm(bpm+4);
(function(){const w=170,pos=v=>(v-40)/120*100;const hr=document.getElementById('hr');hr.style.left=pos(60)+'%';hr.style.width=(pos(108)-pos(60))+'%';
  document.getElementById('hr1').style.left=pos(60)+'%';document.getElementById('hr2').style.left=pos(108)+'%';})();

/* ---------- MIDI ---------- */
let midiReady=false;
async function initMIDI(){
  const box=document.getElementById('midiBox'),st=document.getElementById('midiSt');
  if(!navigator.requestMIDIAccess){box.className='box midi bad';st.textContent='este navegador no tiene Web MIDI';toast('este navegador no tiene MIDI (Safari no lo soporta)');return;}
  try{const acc=await navigator.requestMIDIAccess();
    const bind=()=>{let n=0,name='';acc.inputs.forEach(i=>{i.onmidimessage=onMidi;n++;name=i.name});
      midiReady=n>0;box.className='box midi '+(n?'ok':'bad');st.textContent=n?name:'sin teclado detectado';document.body.classList.toggle('midi-on',midiReady);if(midiReady)requestAnimationFrame(drawAnalysis);toast(n?'MIDI: '+name:'no se detecta teclado MIDI');};
    bind();acc.onstatechange=bind;
  }catch(e){box.className='box midi bad';st.textContent='MIDI bloqueado por el navegador';toast('el navegador bloqueó el MIDI');}
}
function onMidi(ev){const [s,n,v]=ev.data;const t=s&0xf0;
  if(t===0x90&&v>0){playedKeys.set(n,v);if(rec&&playing)played.push({midi:n,vel:v,t:performance.now()});drawKB();}
  else if(t===0x80||(t===0x90&&v===0)){playedKeys.delete(n);drawKB();}}
document.getElementById('midiBtn').onclick=initMIDI;

/* ---------- análisis ---------- */
let take=null;
function analyze(exp,pl,real){
  const win=60/bpm/4*1000*.6,used=new Set();
  const res=exp.map(e=>{let b=-1,bd=1e9;pl.forEach((p,j)=>{if(used.has(j)||p.midi!==e.midi)return;const d=Math.abs(p.t-e.t);if(d<bd&&d<=win){bd=d;b=j}});
    if(b>=0){used.add(b);return {...e,dev:pl[b].t-e.t,vel:pl[b].vel}}return {...e,miss:true}});
  return {res,wrong:pl.length-used.size,real};
}
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function exampleTake(seed=7){
  const r=rng(seed),sp=60/bpm/4*1000,exp=[],pl=[];const gauss=()=>{let u=0;for(let k=0;k<4;k++)u+=r();return (u-2)*1.6};
  FULL.filter(Boolean).forEach((e,k)=>{const t=k*sp;
    [['r',e.rh,e.fr],['l',e.lh,e.fl]].forEach(([h,m,f])=>{exp.push({midi:m,t,f,h,ix:exp.length,full:e.full});
      const weak=(f===4?1:0)+(f===5?.7:0)+(h==='l'?.4:0);const drift=k/FULL.length*14;
      if(r()<.012+weak*.01)return;
      pl.push({midi:(r()<.008?m+(r()<.5?1:2):m),t:t+gauss()*9+weak*16+drift,vel:Math.round(Math.max(20,Math.min(127,92-weak*22+gauss()*7)))});});});
  return analyze(exp,pl,false);
}
function finishRec(){rec=false;if(!expected.length)return;take=analyze(expected,played,true);drawAnalysis();toast('toma analizada');}
document.getElementById('demoTake').onclick=()=>{take=exampleTake(Math.floor(Math.random()*1e6)+1);drawAnalysis();};

function drawAnalysis(){
  if(!take)take=exampleTake();
  const {res,wrong,real}=take;
  const chip=document.getElementById('takeChip');chip.textContent=real?'TU TOMA':'TOMA DE EJEMPLO';chip.className='chip'+(real?' real':'');
  document.getElementById('takeNote').textContent=real?`${bpm} bpm · ${res.length/2|0} pasos`:'apretá REC y tocá para ver tu toma';
  const hit=res.filter(r=>!r.miss),acc=hit.length/res.length*100;
  const mabs=hit.reduce((a,r)=>a+Math.abs(r.dev),0)/(hit.length||1);
  const vs=hit.map(r=>r.vel),vm=vs.reduce((a,b)=>a+b,0)/(vs.length||1),vsd=Math.sqrt(vs.reduce((a,b)=>a+(b-vm)**2,0)/(vs.length||1));
  const even=Math.max(0,100-vsd/vm*100*2.2);const errs=res.length-hit.length+wrong;
  const K=[['precisión',acc.toFixed(0),'%',acc,C.cyan],['desvío',mabs.toFixed(0),'ms',100-Math.min(100,mabs*2),C.yel],['parejo',even.toFixed(0),'%',even,C.mag],['errores',errs,'',100-Math.min(100,errs*4),C.silver]];
  document.getElementById('kpis').innerHTML=K.map(([l,v,u,p,c])=>`<div class="kpi"><span class="lbl">${l}</span><b>${v}<small> ${u}</small></b><div class="bar"><i style="width:${Math.max(2,p)}%;background:${c}"></i></div></div>`).join('');
  // tiempo
  {const c=document.getElementById('chT');const [g,W,H]=fit(c);const N=Math.max(...res.map(r=>r.full))+1,mid=H/2,sc=(H/2-8)/80;
    g.fillStyle='rgba(31,224,255,.07)';g.fillRect(0,mid-25*sc,W,50*sc);
    [-50,0,50].forEach(v=>{g.fillStyle=v?C.faint:C.dim;g.fillRect(0,mid-v*sc,W,1);});
    g.fillStyle=C.dim;g.font='9px IBM Plex Mono';g.fillText('+50',2,mid-50*sc-3);g.fillText('−50',2,mid+50*sc+10);
    res.forEach(r=>{const x=6+r.full/N*(W-12);
      if(r.miss){g.fillStyle=C.mag;g.fillRect(x-2,H-6,4,4);return;}
      const y=mid-Math.max(-80,Math.min(80,r.dev))*sc;g.beginPath();g.arc(x,y,2.2,0,7);
      if(r.h==='r'){g.fillStyle=FC[r.f];g.fill()}else{g.strokeStyle=FC[r.f];g.lineWidth=1;g.stroke()}});}
  // dedos
  {const c=document.getElementById('chF');const [g,W,H]=fit(c);const cols=[['l',5],['l',4],['l',3],['l',2],['l',1],['r',1],['r',2],['r',3],['r',4],['r',5]];
    const cw=W/10,top=10,mid=58,vb=H-22;g.fillStyle=C.faint;g.fillRect(0,mid,W,1);
    cols.forEach(([h,f],k)=>{const rs=hit.filter(r=>r.h===h&&r.f===f);const d=rs.reduce((a,r)=>a+r.dev,0)/(rs.length||1),v=rs.reduce((a,r)=>a+r.vel,0)/(rs.length||1);
      const x=k*cw+cw*.2,w=cw*.6,hh=Math.max(-46,Math.min(46,d))*1.1;
      g.fillStyle=FC[f];g.globalAlpha=.9;g.fillRect(x,hh>0?mid-hh:mid,w,Math.abs(hh)||1);
      g.globalAlpha=.35;g.fillRect(x,vb-(v/127)*44,w,(v/127)*44);g.globalAlpha=1;g.fillRect(x,vb-(v/127)*44,w,2);
      g.fillStyle=C.silver;g.font='600 10px IBM Plex Mono';g.textAlign='center';g.fillText(f,x+w/2,H-6);
      g.fillStyle=C.dim;g.font='9px IBM Plex Mono';g.fillText((d>0?'+':'')+d.toFixed(0),x+w/2,hh>0?mid-hh-4:mid+Math.abs(hh)+11);g.textAlign='left';});
    g.fillStyle=C.faint;g.fillRect(W/2,top,1,H-top-14);g.fillStyle=C.dim;g.font='9px IBM Plex Mono';g.fillText('MI',2,10);g.textAlign='right';g.fillText('MD',W-2,10);g.textAlign='left';}
  // fuerza
  {const c=document.getElementById('chV');const [g,W,H]=fit(c);const N=Math.max(...res.map(r=>r.full))+1,mid=H/2,bw=(W-12)/N;
    g.fillStyle=C.faint;g.fillRect(0,mid,W,1);
    res.forEach(r=>{if(r.miss)return;const x=6+r.full/N*(W-12),h=r.vel/127*(mid-4);g.fillStyle=FC[r.f];g.globalAlpha=.85;
      r.h==='r'?g.fillRect(x,mid-h,Math.max(1,bw-.5),h):g.fillRect(x,mid+1,Math.max(1,bw-.5),h);});g.globalAlpha=1;}
}

/* toast */
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200);}

/* teclado de la compu como espacio = play/stop */
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();playing?(rec=false,stop()):start(mode);}});

let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{drawDynamic();drawAnalysis()},80)});
renderAll();
document.fonts&&document.fonts.ready.then(()=>{drawDynamic();drawAnalysis()});
</script>
